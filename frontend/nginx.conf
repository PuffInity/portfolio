server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # =========================
    # 1) Кастомна 404
    # =========================
    error_page 404 /pages/404.html;

    # ======== ВІДДАЧА КАРТИНОК З VOLUME ========
    location /uploads/ {
        root /usr/share/nginx/html;
        autoindex off;
    }

    # internal => цю сторінку НЕ можна відкрити напряму через URL
    # її може віддати тільки nginx як error_page
    location = /pages/404.html { internal; }


    # =========================
    # 2) Головна сторінка
    # =========================
    # /main -> віддаємо готовий HTML
    location = /main {
        try_files /pages/index.html =404;
    }


    # =========================
    # 3) Публічні сторінки
    # =========================
    location ^~ /debug       { try_files /pages/bagAndOpt.html       =404; }
    location ^~ /turnkey     { try_files /pages/turnKey.html         =404; }
    location ^~ /integrations { try_files /pages/integration.html     =404; }
    location ^~ /portfolio           { try_files /pages/portfolio.html       =404; }

    # 🔓 login має бути відкритий завжди
    # (це сторінка входу, вона не потребує сесії)
    location ^~ /login {
        try_files /pages/adminPage/log.html =404;
    }


    # =========================
    # 4) 🔒 Захищена адмін-панель
    # =========================
    # Користувач відкриває /adminPanel
    # 1) nginx робить внутрішній auth-запит на /_auth_admin
    # 2) якщо backend повернув 200 -> віддаємо adminPanel.html
    # 3) якщо backend повернув 403 -> редіректимо на /login
    location ^~ /adminPanel {

        # ✅ запит в бекенд "чи є сесія?"
        auth_request /_auth_admin;

        # Якщо нема доступу — перенаправляємо на /login
        error_page 401 403 = @admin_login;

        # Віддаємо html адмін-панелі (тільки якщо auth_request = 200)
        try_files /pages/adminPage/adminPanel.html =404;
    }

    # named location для редіректа
location @admin_login {
    return 307 /login;
}


    # =========================
    # 5) Внутрішній auth endpoint для nginx
    # =========================
    # Цей endpoint НЕ доступний з браузера
    # Його може викликати тільки auth_request
    location = /_auth_admin {
        internal;

        # ⚠️ важливо: тут має бути реальна адреса бекенда в docker network
        # приклад: http://backend:3000/admin/check-session-for-nginx
        proxy_pass http://backend:3000/admin/check-session-for-nginx;

        # auth_request не повинен слати body
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # ✅ важливо для сесії через cookie:
        # - Host інколи впливає на middleware / session логіку
        # - X-Forwarded-For дає реальний IP клієнта
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # ✅ дуже часто треба ще це (щоб бекенд знав що це проксі)
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # 6) Статика (css/js/img)
    # =========================
    # Ти можеш залишити як було закоментовано,
    # але Я РЕКОМЕНДУЮ включити, щоб nginx віддавав /css, /js і т.д.
    location / {
        try_files $uri /pages/index.html =404;
    }
}
